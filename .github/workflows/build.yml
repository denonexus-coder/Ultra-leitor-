name: Build Fabric

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fabric_1_21_11
            artifact: linearreader-fabric-1.21.11
          - target: fabric_1_20_to_1_20_1
            artifact: linearreader-fabric-1.20.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod with Gradle
        run: ./gradlew :targets:${{ matrix.target }}:build -x test --stacktrace

      - name: Upload Mod Jars
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: modules/targets/${{ matrix.target }}/build/libs/*.jar
