name: Build Fabric 1.21.11

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod with Gradle
        run: ./gradlew :targets:fabric_1_21_11:build --stacktrace

      - name: Upload Mod Jars
        uses: actions/upload-artifact@v4
        with:
          name: linearreader-fabric-1.21.11
          path: modules/targets/fabric_1_21_11/build/libs/*.jar
