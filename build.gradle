plugins {
    id 'base'
}

def fabric12111Target = findProject(':targets:fabric_1_21_11')

tasks.register('buildFabric') {
    group = 'linearreader'
    description = 'Builds the Fabric 1.21.11 target.'
    if (fabric12111Target != null) {
        dependsOn fabric12111Target.tasks.named('build')
    }
}

tasks.register('cleanFabric') {
    group = 'linearreader'
    description = 'Cleans the Fabric 1.21.11 target.'
    if (fabric12111Target != null) {
        dependsOn fabric12111Target.tasks.named('clean')
    }
}

tasks.register('testFabric') {
    group = 'linearreader'
    description = 'Runs Fabric 1.21.11 target tests.'
    if (fabric12111Target != null) {
        dependsOn fabric12111Target.tasks.named('test')
    }
}

tasks.named('build').configure {
    dependsOn tasks.named('buildFabric')
}

tasks.named('clean').configure {
    dependsOn tasks.named('cleanFabric')
}

tasks.register('collectJars', Copy) {
    group = 'linearreader'
    description = 'Collects built mod jars into root/build/collected-jars.'
    dependsOn tasks.named('buildFabric')
    into layout.buildDirectory.dir('collected-jars')
    if (fabric12111Target != null) {
        from(fabric12111Target.layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources.jar', '*-javadoc.jar'
            into 'fabric_1_21_11'
        }
    }
}
